[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quran-alignment-benchmark"
version = "0.2.0"
description = "Scorer, schemas and corpus access for the Quran recitation alignment benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
dependencies = ["pydantic>=2.5"]

[project.optional-dependencies]
corpus = ["datasets>=2.19", "huggingface_hub>=0.23"]
dev = ["pytest>=8", "ruff>=0.15,<0.16"]

[project.scripts]
qab = "qab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qab"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
